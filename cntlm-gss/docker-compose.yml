services:
  cntlm:
    image: cntlm-gss:3.0.0-amd64
    container_name: cntlm-gss
    # KRB5CCNAME is needed in order to get correct credential cache
    # All environment variables are pulled from .env file
    environment:
      - AD_USER=$AD_USER
      - CNTLM_CONFIG=${CNTLM_CONFIG:-/etc/cntlm.conf}
      - KRB5_CONFIG=${KRB5_CONFIG:-/etc/krb5.conf}
      - KRB5CCNAME=$KRB5CCNAME
    ports:
      - 3128:3128
    restart: always
    # Bind time files for time sync
    volumes:
      - /etc/timezone:/etc/timezone:ro
      - /etc/localtime:/etc/localtime:ro
      # Put secrets (password) here
      - ./data/secrets:/data/secrets:ro
      # Put override configs here (optional)
      # - ./conf:/data/conf:ro

networks:
  # Configure default network.
  # Use this network to access net via containers
  default:
    name: cntlm-net
    driver: bridge
    external: true
