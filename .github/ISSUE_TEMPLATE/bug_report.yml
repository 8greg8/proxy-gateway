name: Bug Report
description: Report a bug in proxy-gateway
title: '[Bug] '
labels: ['bug']
body:
  - type: textarea
    id: description
    attributes:
      label: Description
      description: A clear and concise description of the bug.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      description: Steps to reproduce the behavior.
      placeholder: |
        1. Go to...
        2. Click on...
        3. Observe...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What you expected to happen.
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual Behavior
      description: What actually happened.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Error Logs / Stack Trace
      description: Paste any error messages, stack traces, or container logs (docker compose logs cntlm; remove credentials, hostnames and IP addresses first).
      render: shell
    validations:
      required: false
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Please provide the following details.
      value: |
        - OS:
        - Docker and Docker Compose versions:
        - proxy-gateway version or commit:
        - Proxy type (NTLM, Kerberos):
    validations:
      required: true
